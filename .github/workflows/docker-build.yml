name: Docker build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} (amd64 + arm64, sans publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Démarrage complet (cp .env.example .env && docker compose up -d --build)
        run: |
          cp .env.example .env
          docker compose up -d --build
          bash ./scripts/wait-healthy.sh 300
      - name: Contrôles de santé et persistance
        run: |
          set -e
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/users)" = "401"
          docker compose exec -T api test -s /run/chandelier-secrets/initial_admin_password
          docker compose down
          docker compose up -d
          bash ./scripts/wait-healthy.sh 180
          docker compose logs api | grep -q "un super administrateur existe déjà"
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - name: Nettoyage
        if: always()
        run: docker compose down -v
